<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>profile</title>
</head>
<body>
<h1>profile page</h1>
<a href="http://127.0.0.1:8000/book/contact">contact page</a>
<h2>user name is:{{name}}</h2>
<h2>user email is:{{email}}</h2>
<h2>the profile page is created</h2>
{% if role == "admin"%}
  <h1>this is admin portal</h1>
{% endif %}

<table border="1">
    <tr>
        <th>NAME</th>
        <th>email</th>
    </tr>
    {% for data in user_data %}
    <tr>
       <td>{{data.name}}</td>
       <td>{{data.email}}</td>
    </tr>
    {% endfor %}
</table>

</body>
</html>
